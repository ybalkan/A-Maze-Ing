[project]
name = "mazegen"
version = "0.1.0"
description = "A reusable maze generator module for the 42 A-Maze-Ing project"
authors = [
  { name = "ybalkan", email = "ybalkan@student.42kocaeli.com.tr" },
  { name = "iuslu",   email = "iuslu@student.42kocaeli.com.tr" },
]
license = { file = "LICENSE.md" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["flake8", "mypy", "pytest", "build"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mazegen"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.venv*",
  "/obj",
  "/mlx-2.2",
  "__pycache__"
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
cache_dir   = "obj/.pytest_cache"
testpaths   = ["tests"]
addopts     = "-v"
